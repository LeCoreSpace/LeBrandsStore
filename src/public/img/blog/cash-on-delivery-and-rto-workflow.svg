<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="t d"><title id="t">Cash on delivery and RTO workflow</title><desc id="d">A parcel moving along a route from order to delivery, with a return loop for failed deliveries.</desc><rect width="1200" height="800" fill="#fdf8f6"/><circle cx="1080" cy="720" r="260" fill="#f6e7e3"/><circle cx="90" cy="60" r="180" fill="#f6e7e3" opacity=".7"/><rect x="40" y="40" width="1120" height="720" rx="28" fill="none" stroke="#e9d3cf" stroke-width="2"/><path d="M160 330H1040" stroke="#e9d3cf" stroke-width="8"/><path d="M160 330H700" stroke="#874353" stroke-width="8"/><circle cx="160" cy="330" r="30" fill="#874353" stroke="#874353" stroke-width="5"/><text x="160" y="410" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#38282b">Order</text><circle cx="400" cy="330" r="30" fill="#874353" stroke="#874353" stroke-width="5"/><text x="400" y="410" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#38282b">Confirm</text><circle cx="640" cy="330" r="30" fill="#874353" stroke="#874353" stroke-width="5"/><text x="640" y="410" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#38282b">Ship</text><circle cx="880" cy="330" r="30" fill="#fff" stroke="#874353" stroke-width="5"/><text x="880" y="410" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#38282b">Deliver</text><path d="M880 300C880 190 640 190 640 290" stroke="#ce928b" stroke-width="5" fill="none" stroke-dasharray="4 14" stroke-linecap="round"/><path d="M640 290l-12-22M640 290l22-14" stroke="#ce928b" stroke-width="5"/><text x="760" y="170" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#874353">Return to origin</text><g transform="translate(250 500)"><rect width="180" height="120" rx="10" fill="#ce928b"/><path d="M0 40H180M90 0v40" stroke="#874353" stroke-width="8"/></g><rect x="560" y="490" width="440" height="150" rx="14"